server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static SPA — fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the chatbot service. The trailing slash on proxy_pass
    # strips the /api/chatbot/ prefix, so the backend sees /chat/stream, /models, etc.
    # proxy_buffering off + X-Accel-Buffering: no are mandatory — without them nginx
    # buffers the SSE stream and the browser gets all tokens at once at the end.
    location /api/chatbot/ {
        proxy_pass http://chatbot:8082/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    # Reverse proxy to the dashboard service (same prefix-strip rule).
    location /api/dashboard/ {
        proxy_pass http://dashboard:8083/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
    }
}
