apiVersion: v1
kind: Secret
metadata:
  name: llmobs-secrets
  namespace: llmobs
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  GOOGLE_API_KEY: "REPLACE_ME"
  GROQ_API_KEY: "REPLACE_ME"
  # Collector: comma-separated keys it accepts. Required — ingestion will not
  # start without it. Rotating means a rolling restart, since keys load at boot.
  INFERSCOPE_API_KEYS: "REPLACE_ME"
  # SDK clients: the key they present. Must match one of the above.
  INFERSCOPE_API_KEY: "REPLACE_ME"
