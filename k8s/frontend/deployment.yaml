apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: llmobs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: atharv19/inferscope-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
